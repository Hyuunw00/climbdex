<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Climbdex</title><meta name="description" content="찍기만 하면 정리되는 내 클라이밍 기록"><style>
:root{color-scheme:light;--accent:#d7263d;--text:#111;--sub:#6b7280;--line:#e5e7eb;--surface:#f5f6f7}
